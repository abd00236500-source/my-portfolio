<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Reaction Test | ABDO ARCADE</title>
<style>
:root{--bg:#070b16;--panel:#111c32;--cyan:#55d8ff;--muted:#aab8d2;--green:#58ffc5;--red:#ff5874}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172d50 0%,var(--bg) 68%);color:#fff;font-family:Arial,sans-serif}
button{font:inherit;touch-action:manipulation}
.wrap{width:min(100%,650px);margin:auto;padding:18px 15px 30px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:900;letter-spacing:1px;color:var(--cyan);font-size:19px}
.back{color:#fff;text-decoration:none;border:1px solid #344765;border-radius:11px;padding:9px 12px;font-size:13px}
.hero{text-align:center;padding:30px 0 20px}
.tag{color:var(--cyan);font-size:11px;letter-spacing:3px}
h1{font-size:clamp(30px,8vw,43px);margin:10px 0}
h1 span{color:var(--cyan)}
.hero p{color:var(--muted);font-size:14px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0}
.stat{background:#101a2e;border:1px solid #263e62;border-radius:14px;text-align:center;padding:13px 5px}
.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}
.stat strong{font-size:clamp(18px,5vw,25px);color:var(--cyan);font-variant-numeric:tabular-nums}
.test{width:100%;min-height:280px;border:1px solid #31527c;border-radius:22px;background:linear-gradient(145deg,#1a3154,#10192c);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:25px;text-align:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
.test .symbol{font-size:55px}
.test strong{font-size:clamp(22px,6vw,30px)}
.test p{color:#c2d0e6;font-size:14px;line-height:1.8;margin:0}
.test.wait{background:linear-gradient(145deg,#713047,#351526);border-color:var(--red)}
.test.go{background:linear-gradient(145deg,#087b59,#064b3d);border-color:var(--green);box-shadow:0 0 35px #58ffc530}
.test.result{background:linear-gradient(145deg,#17466b,#102b49);border-color:var(--cyan)}
.actions{display:flex;gap:10px;margin-top:16px}
.action{flex:1;border:1px solid #36577c;background:#111c32;color:#fff;border-radius:12px;padding:13px 8px;cursor:pointer}
.action.primary{background:var(--cyan);color:#06101e;border-color:var(--cyan);font-weight:bold}
.message{min-height:25px;text-align:center;color:var(--green);font-size:14px;margin:14px 0 0;line-height:1.7}
.tip{text-align:center;color:#7889a7;font-size:12px;line-height:1.8;margin-top:20px}
@media(max-width:380px){.wrap{padding-inline:11px}.stats{gap:6px}.stat{padding:10px 3px}.test{min-height:250px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<nav>
<div class="logo">ABDO ARCADE</div>
<a class="back" href="../games.html">← قائمة الألعاب</a>
</nav>
<header class="hero">
<div class="tag">GAME 04 · REACTION CHALLENGE</div>
<h1>اختبار <span>سرعة رد الفعل</span> ⚡</h1>
<p>استنى اللون الأخضر، واضغط بأسرع ما تقدر! وشوف سرعة استجابتك.</p>
</header>

<section class="stats" aria-label="إحصائياتك">
<div class="stat"><small>أفضل زمن</small><strong id="best">—</strong></div>
<div class="stat"><small>متوسط الزمن</small><strong id="average">—</strong></div>
<div class="stat"><small>المحاولات</small><strong id="attempts">0</strong></div>
</section>

<button class="test" id="test" type="button">
<span class="symbol" id="symbol">⚡</span>
<strong id="title">ابدأ التحدي</strong>
<p id="description">اضغط هنا، واستعد لظهور اللون الأخضر</p>
</button>

<div class="message" id="message" aria-live="polite">جاهز تختبر سرعة رد فعلك؟ 🎮</div>
<div class="actions">
<button class="action primary" id="restart">🔄 محاولة جديدة</button>
<button class="action" id="reset">🗑️ مسح السجل</button>
</div>
<p class="tip">النتائج تُحفظ تلقائيًا على جهازك • كلما قل الزمن كانت استجابتك أسرع</p>
</main>

<script>
(function(){
const KEY="abdo_arcade_reaction_v1";
const test=document.getElementById("test");
const symbol=document.getElementById("symbol");
const title=document.getElementById("title");
const description=document.getElementById("description");
const message=document.getElementById("message");
const bestEl=document.getElementById("best");
const averageEl=document.getElementById("average");
const attemptsEl=document.getElementById("attempts");

let state="idle",timer=null,startTime=0,delay=0;
let stats=loadStats();

function loadStats(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY));
  if(data && Array.isArray(data.times)){
   return {times:data.times.filter(n=>Number.isFinite(n)&&n>0).slice(-1000),attempts:Math.max(0,Number(data.attempts)||0)};
  }
 }catch(e){}
 return {times:[],attempts:0};
}
function saveStats(){
 try{localStorage.setItem(KEY,JSON.stringify(stats));}catch(e){
  message.textContent="تعذر حفظ النتائج في مساحة التخزين.";
 }
}
function renderStats(){
 const times=stats.times;
 bestEl.textContent=times.length?Math.min(...times)+" ms":"—";
 averageEl.textContent=times.length?Math.round(times.reduce((a,b)=>a+b,0)/times.length)+" ms":"—";
 attemptsEl.textContent=stats.attempts;
}
function clearTimer(){if(timer!==null){clearTimeout(timer);timer=null;}}
function showIdle(){
 clearTimer();state="idle";
 test.className="test";
 symbol.textContent="⚡";
 title.textContent="ابدأ التحدي";
 description.textContent="اضغط هنا، واستعد لظهور اللون الأخضر";
}
function start(){
 clearTimer();state="waiting";
 test.className="test wait";
 symbol.textContent="⏳";
 title.textContent="استنى اللون الأخضر...";
 description.textContent="ماتضغطش دلوقتي!";
 message.textContent="ركز كويس 👀";
 delay=1000+Math.random()*3000;
 timer=setTimeout(()=>{
  timer=null;
  if(state!=="waiting")return;
  state="go";startTime=performance.now();
  test.className="test go";
  symbol.textContent="🟢";
  title.textContent="اضغط الآن!";
  description.textContent="يلا بسرعة!";
 },delay);
}
function finish(){
 const elapsed=Math.round(performance.now()-startTime);
 state="result";
 stats.times.push(elapsed);
 if(stats.times.length>1000)stats.times=stats.times.slice(-1000);
 stats.attempts++;
 saveStats();renderStats();
 test.className="test result";
 symbol.textContent="⚡";
 title.textContent=elapsed+" مللي ثانية";
 description.textContent="اضغط لبدء محاولة جديدة";
 message.textContent=elapsed<200?"استجابة سريعة جدًا! 🔥":elapsed<300?"أداء ممتاز! 👏":"حاول تاني وشوف تقدر تحسن نتيجتك!";
}
test.addEventListener("click",()=>{
 if(state==="idle"||state==="result"){start();return;}
 if(state==="waiting"){
  clearTimer();state="idle";
  test.className="test wait";
  symbol.textContent="❌";
  title.textContent="بدري أوي!";
  description.textContent="استنى الأخضر قبل ما تضغط";
  message.textContent="ضغطت قبل الإشارة! اضغط لبدء محاولة جديدة.";
  return;
 }
 if(state==="go")finish();
});
document.getElementById("restart").addEventListener("click",showIdle);
document.getElementById("reset").addEventListener("click",()=>{
 if(!confirm("متأكد إنك عايز تمسح كل النتائج المحفوظة؟"))return;
 stats={times:[],attempts:0};
 saveStats();renderStats();showIdle();
 message.textContent="تم مسح سجل النتائج.";
});
renderStats();
})();
</script>
</body>
</html>
