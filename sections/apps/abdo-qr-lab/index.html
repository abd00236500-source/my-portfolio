<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDO QR LAB</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;min-height:100vh;
 font-family:Arial,sans-serif;color:#fff;
 background:linear-gradient(145deg,#080d1a,#10243c);
}
.container{
 max-width:520px;margin:auto;padding:25px;
 background:rgba(8,13,26,.85);
 border:1px solid rgba(85,199,255,.4);
 border-radius:24px;box-shadow:0 15px 45px #0008;
}
h1{text-align:center;color:#55c7ff;letter-spacing:2px}
.subtitle{text-align:center;color:#b8c9d8;margin-bottom:25px}
label{display:block;margin:15px 0 7px;color:#55c7ff}
input{
 width:100%;padding:14px;border-radius:12px;
 border:1px solid #31516b;background:#101d2e;
 color:white;font-size:16px;outline:none;
}
input:focus{border-color:#55c7ff}
button{
 width:100%;padding:15px;margin-top:20px;
 border:0;border-radius:12px;background:#55c7ff;
 color:#06111e;font-weight:bold;font-size:17px;
}
#result{display:none;text-align:center;margin-top:25px}
#qr{background:white;padding:12px;border-radius:15px;max-width:100%}
.note{font-size:13px;line-height:1.8;color:#aebdca;margin-top:20px}
</style>
</head>
<body>
<div class="container">
<h1>ABDO QR LAB</h1>
<p class="subtitle">اصنع بطاقة QR شخصية خاصة بك</p>

<label>الاسم</label>
<input id="name" maxlength="35" placeholder="اكتب اسمك">

<label>رقم الهاتف</label>
<input id="phone" type="tel" maxlength="20" placeholder="01xxxxxxxxx">

<label>رابط TikTok (اختياري)</label>
<input id="tiktok" placeholder="https://www.tiktok.com/@username">

<label>رابط Instagram (اختياري)</label>
<input id="instagram" placeholder="https://instagram.com/username">

<label>رابط Facebook (اختياري)</label>
<input id="facebook" placeholder="https://facebook.com/username">

<label>رقم WhatsApp (اختياري)</label>
<input id="whatsapp" type="tel" maxlength="20" placeholder="01xxxxxxxxx">

<label>رابط Telegram (اختياري)</label>
<input id="telegram" placeholder="https://t.me/username">

<button onclick="generateQR()">إنشاء QR CODE</button>

<div id="result">
<h2 style="color:#55c7ff">تم إنشاء الكود بنجاح</h2>
<div id="qr"></div>
<button onclick="saveQR()">حفظ صورة QR</button>
<button onclick="copyLink()" style="background:#263d55;color:white">نسخ رابط البطاقة</button>
<p id="status" class="note"></p>
</div>


<div id="reader" style="margin-top:30px;padding-top:20px;border-top:1px solid #31516b">
<h2 style="text-align:center;color:#55c7ff">قارئ QR CODE</h2>
<p class="note">اقرأ أي QR من الكاميرا أو من صورة محفوظة على هاتفك.</p>
<button onclick="startScanner()">تشغيل الكاميرا</button>
<label for="qrFile">أو اختر صورة QR من المعرض</label>
<input id="qrFile" type="file" accept="image/*" onchange="readQRImage(event)">
<video id="qrVideo" playsinline style="display:none;width:100%;margin-top:15px;border-radius:12px"></video>
<button id="stopScanner" onclick="stopScanner()" style="display:none;background:#263d55;color:white">إيقاف الكاميرا</button>
<p id="readerStatus" class="note"></p>
<div id="readResult" style="display:none;margin-top:15px">
<label>محتويات QR:</label>
<div id="qrPretty" style="text-align:right;background:#142b40;padding:15px;border-radius:12px;margin-bottom:12px;line-height:2;overflow-wrap:anywhere"></div>
<textarea id="qrContent" readonly style="width:100%;min-height:110px;padding:12px;border-radius:12px;background:#101d2e;color:white;border:1px solid #55c7ff;direction:auto"></textarea>
<button onclick="copyQRContent()">نسخ المحتوى</button>
</div>
</div>

<p class="note">
تنبيه الخصوصية: أي شخص يحصل على صورة QR أو رابط البطاقة يمكنه رؤية البيانات التي أضفتها.
لا تضع بيانات خاصة أو حساسة.
</p>
</div>

<script src="qrcode.min.js"></script>
<script>
let qrDetector=null, qrStream=null, scanFrame=null;

async function getQRDetector(){
 if(!("BarcodeDetector" in window)) throw Error("المتصفح لا يدعم قراءة QR المدمجة. جرّب Chrome محدثًا.");
 const formats=await BarcodeDetector.getSupportedFormats();
 if(!formats.includes("qr_code")) throw Error("قارئ QR غير مدعوم في هذا المتصفح.");
 return new BarcodeDetector({formats:["qr_code"]});
}

function addQRLine(label,value){
 if(!value)return;
 const box=document.getElementById("qrPretty");
 const row=document.createElement("p");
 const title=document.createElement("strong");
 const content=document.createElement("span");
 title.textContent=label+": ";
 content.textContent=value;
 row.append(title,content);
 box.appendChild(row);
}

function renderQRDetails(value){
 const box=document.getElementById("qrPretty");
 box.replaceChildren();

 const showRaw=()=>addQRLine("النص الموجود داخل الرمز",value);

 try{
  if(value.startsWith("WIFI:")){
   const part=value.slice(5);
   const get=k=>{
    const m=part.match(new RegExp("(?:^|;)"+k+":((?:\\\\\\\\.|[^;])*)"));
    return m?m[1].replace(/\\\\([;,:\\\\])/g,"$1"):"";
   };
   addQRLine("نوع الشبكة",get("T")||"غير محدد");
   addQRLine("اسم شبكة Wi-Fi",get("S"));
   addQRLine("كلمة المرور",get("P")||"لا توجد");
   addQRLine("إخفاء الشبكة",get("H"));
   return;
  }

  if(/^BEGIN:VCARD/i.test(value)){
   const lines=value.replace(/\r/g,"").split("\n");
   for(const [key,label] of [["FN","الاسم"],["N","الاسم الكامل"],["ORG","الشركة"],["TITLE","الوظيفة"],["TEL","الهاتف"],["EMAIL","البريد الإلكتروني"],["URL","الموقع"],["ADR","العنوان"]]){
    const found=lines.filter(x=>x.toUpperCase().startsWith(key+";")||x.toUpperCase().startsWith(key+":"));
    found.forEach(x=>addQRLine(label,x.slice(x.indexOf(":")+1)));
   }
   return;
  }

  if(value.startsWith("MECARD:")){
   const data=value.slice(7);
   for(const [key,label] of [["N","الاسم"],["TEL","الهاتف"],["EMAIL","البريد الإلكتروني"],["URL","الموقع"],["ADR","العنوان"]]){
    const m=data.match(new RegExp("(?:^|;)"+key+":([^;]*)"));
    if(m)addQRLine(label,m[1]);
   }
   return;
  }

  if(/^https?:\/\//i.test(value)){
   const url=new URL(value);
   addQRLine("نوع البيانات","رابط موقع إلكتروني");
   addQRLine("الموقع",url.hostname);
   addQRLine("الرابط",value);

   if(url.pathname.endsWith("/profile.html")&&url.hash.length>1){
    try{
     let b64=url.hash.slice(1).replace(/-/g,"+").replace(/_/g,"/");
     b64+="=".repeat((4-b64.length%4)%4);
     const decoded=decodeURIComponent(Array.from(atob(b64),c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join(""));
     const data=JSON.parse(decoded);
     if(data&&data.n){
      box.replaceChildren();
      addQRLine("نوع البيانات","بطاقة تعريف ABDO");
      addQRLine("الاسم",data.n);
      addQRLine("رقم الهاتف",data.p);
      addQRLine("TikTok",data.tt);
      addQRLine("Instagram",data.ig);
      addQRLine("Facebook",data.fb);
      addQRLine("WhatsApp",data.wa);
      addQRLine("Telegram",data.tg);
      return;
     }
    }catch(e){}
   }
   return;
  }

  if(/^mailto:/i.test(value)){
   addQRLine("نوع البيانات","بريد إلكتروني");
   addQRLine("العنوان",value.slice(7).split("?")[0]);
   return;
  }

  if(/^tel:/i.test(value)){
   addQRLine("نوع البيانات","رقم هاتف");
   addQRLine("رقم الهاتف",value.slice(4));
   return;
  }

  if(/^(sms|smsto):/i.test(value)){
   addQRLine("نوع البيانات","رسالة SMS");
   addQRLine("البيانات",value);
   return;
  }

  if(/^geo:/i.test(value)){
   addQRLine("نوع البيانات","موقع جغرافي");
   addQRLine("الإحداثيات",value.slice(4));
   return;
  }

  addQRLine("نوع البيانات","نص أو بيانات عامة");
  showRaw();
 }catch(e){
  showRaw();
 }
}

function showQRResult(value){
 document.getElementById("qrContent").value=value;
 renderQRDetails(value);
 document.getElementById("readResult").style.display="block";
 document.getElementById("readerStatus").textContent="تمت قراءة QR بنجاح.";
 stopScanner();
}

async function startScanner(){
 try{
  qrDetector=await getQRDetector();
  qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  const video=document.getElementById("qrVideo");
  video.srcObject=qrStream;
  video.style.display="block";
  document.getElementById("stopScanner").style.display="block";
  await video.play();
  document.getElementById("readerStatus").textContent="وجّه الكاميرا نحو رمز QR.";
  const scan=async()=>{
   if(!qrStream)return;
   try{
    const codes=await qrDetector.detect(video);
    if(codes.length){showQRResult(codes[0].rawValue);return;}
   }catch(e){}
   scanFrame=requestAnimationFrame(scan);
  };
  scan();
 }catch(e){
  document.getElementById("readerStatus").textContent="تعذر تشغيل القارئ: "+e.message;
  stopScanner();
 }
}

function stopScanner(){
 if(scanFrame)cancelAnimationFrame(scanFrame);
 scanFrame=null;
 if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null;}
 const video=document.getElementById("qrVideo");
 video.pause();video.srcObject=null;video.style.display="none";
 document.getElementById("stopScanner").style.display="none";
}

async function readQRImage(event){
 const file=event.target.files[0];
 if(!file)return;
 try{
  qrDetector=await getQRDetector();
  const bitmap=await createImageBitmap(file);
  const codes=await qrDetector.detect(bitmap);
  bitmap.close();
  if(codes.length)showQRResult(codes[0].rawValue);
  else document.getElementById("readerStatus").textContent="لم يتم العثور على QR في الصورة.";
 }catch(e){
  document.getElementById("readerStatus").textContent="تعذر قراءة الصورة: "+e.message;
 }
 event.target.value="";
}

async function copyQRContent(){
 const value=document.getElementById("qrContent").value;
 try{await navigator.clipboard.writeText(value);alert("تم نسخ المحتوى.");}
 catch(e){alert("تعذر النسخ من المتصفح.");}
}

</script>
<script>
let profileLink="";

function validLink(value){
 if(!value.trim()) return "";
 try{
  const u=new URL(value);
  if(u.protocol==="https:" &&
  ["tiktok.com","www.tiktok.com","instagram.com","www.instagram.com",
   "facebook.com","www.facebook.com","m.facebook.com",
   "t.me","www.t.me"].includes(u.hostname)) return u.href;
 }catch(e){}
 return "";
}

function generateQR(){
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 if(!name){alert("اكتب الاسم الأول");return;}
 if(!phone){alert("اكتب رقم الهاتف");return;}

 const data={
  n:name,p:phone,
  tt:validLink(document.getElementById("tiktok").value),
  ig:validLink(document.getElementById("instagram").value),
  fb:validLink(document.getElementById("facebook").value),
  wa:document.getElementById("whatsapp").value.replace(/\D/g,""),
  tg:validLink(document.getElementById("telegram").value)
 };

 const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(data))))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

 profileLink=new URL("profile.html",location.href).href+"#"+encoded;

 const box=document.getElementById("qr");
 box.innerHTML="";
 document.getElementById("result").style.display="block";

 new QRCode(box,{
  text:profileLink,
  width:260,
  height:260,
  colorDark:"#000000",
  colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.M
 });

 document.getElementById("status").textContent=
  "امسح الكود بكاميرا هاتف لفتح البطاقة الشخصية.";
}

function saveQR(){
 const img=document.querySelector("#qr img");
 if(!img){alert("أنشئ QR الأول");return;}
 const a=document.createElement("a");
 a.download="ABDO-QR.png";
 a.href=img.src;
 a.click();
}

function copyLink(){
 if(!profileLink)return;
 navigator.clipboard.writeText(profileLink)
 .then(()=>alert("تم نسخ الرابط"))
 .catch(()=>alert("المتصفح لم يسمح بالنسخ. استخدم رابط البطاقة من شريط العنوان بعد إنشائها."));
}
</script>
</body>
</html>
