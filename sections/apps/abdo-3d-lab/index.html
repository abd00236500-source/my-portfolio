<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ABDO 3D LAB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b16;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px 12px 12px}
header h1{margin:5px;color:#43eaff;font-size:27px}
header p{color:#9baec9;font-size:13px}
main{max-width:850px;margin:auto;padding:10px}
.viewer{position:relative;background:radial-gradient(circle at center,#18365b,#080e1d 70%);border:1px solid #23547b;border-radius:18px;overflow:hidden}
canvas{display:block;width:100%;height:420px;touch-action:none}
#hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#a9c9e9;font-size:12px;pointer-events:none}
.panel{background:#111b2d;border:1px solid #263d5c;border-radius:16px;padding:15px;margin-top:14px}
h3{font-size:16px;margin:0 0 12px;color:#48dfff}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,select{border:1px solid #326087;background:#172b46;color:white;border-radius:10px;padding:11px;font-size:14px}
button:active{background:#087eaa}
button.active{background:#087eaa;border-color:#4aeaff}
input[type=color]{width:45px;height:40px;border:0;background:transparent}
label{color:#b8c9df;font-size:13px}
.control{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:13px 0}
input[type=range]{width:58%;accent-color:#35dfff}
footer{text-align:center;color:#7186a5;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
 <div style="color:#40dfff;letter-spacing:4px;font-size:11px">ABDO DIGITAL LAB</div>
 <h1>🧊 ABDO 3D LAB</h1>
 <p>مختبر التصميم ثلاثي الأبعاد التفاعلي</p>
</header>

<main>
 <div class="viewer">
  <canvas id="scene"></canvas>
  <div id="hint">اسحب بإصبعك لتدوير المجسم 👆</div>
 </div>

 <section class="panel">
  <h3>🧊 اختر المجسم</h3>
  <div class="row">
   <button class="active" data-shape="cube">مكعب</button>
   <button data-shape="sphere">كرة</button>
   <button data-shape="cylinder">أسطوانة</button>
   <button data-shape="torus">حلقة</button>
  </div>
 </section>

 <section class="panel">
  <h3>🎨 الألوان</h3>
  <div class="row">
   <button data-color="#16c9ff">أزرق</button>
   <button data-color="#a855f7">بنفسجي</button>
   <button data-color="#16e6a0">أخضر</button>
   <button data-color="#ffad42">برتقالي</button>
   <button data-color="#ff4c87">وردي</button>
   <input type="color" id="customColor" value="#16c9ff" aria-label="لون مخصص">
  </div>
 </section>

 <section class="panel">
  <h3>⚙️ التحكم في المجسم</h3>
  <div class="control">
   <label>الحجم</label>
   <input id="scale" type="range" min="0.5" max="2.5" step="0.1" value="1">
  </div>
  <div class="control">
   <label>سرعة الدوران</label>
   <input id="speed" type="range" min="0" max="0.05" step="0.001" value="0.008">
  </div>
  <div class="row">
   <button id="rotate">إيقاف الدوران</button>
   <button id="reset">إعادة ضبط</button>
   <button id="save">📸 حفظ صورة</button>
  </div>
 </section>
</main>
<footer>ABDO © 2026 — CREATE YOUR 3D WORLD</footer>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=null;

const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(0,0,5);

const renderer=new THREE.WebGLRenderer({
 canvas,antialias:true,alpha:true,preserveDrawingBuffer:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xffffff,0x183050,2));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(3,4,5);
scene.add(light);

const group=new THREE.Group();
scene.add(group);

const material=new THREE.MeshStandardMaterial({
 color:'#16c9ff',metalness:0.45,roughness:0.22
});

let mesh,shape='cube',rotating=true,speed=.008;
const geometries={
 cube:()=>new THREE.BoxGeometry(1.6,1.6,1.6),
 sphere:()=>new THREE.SphereGeometry(1,48,32),
 cylinder:()=>new THREE.CylinderGeometry(.8,.8,1.8,48),
 torus:()=>new THREE.TorusGeometry(.85,.28,24,80)
};

function makeShape(type){
 shape=type;
 if(mesh){
  group.remove(mesh);
  mesh.geometry.dispose();
 }
 mesh=new THREE.Mesh(geometries[type](),material);
 group.add(mesh);
 document.querySelectorAll('[data-shape]').forEach(b=>
  b.classList.toggle('active',b.dataset.shape===type)
 );
}
makeShape('cube');

document.querySelectorAll('[data-shape]').forEach(b=>
 b.addEventListener('click',()=>makeShape(b.dataset.shape))
);
document.querySelectorAll('[data-color]').forEach(b=>
 b.addEventListener('click',()=>material.color.set(b.dataset.color))
);
document.getElementById('customColor').addEventListener('input',e=>
 material.color.set(e.target.value)
);
document.getElementById('scale').addEventListener('input',e=>{
 group.scale.setScalar(Number(e.target.value));
});
document.getElementById('speed').addEventListener('input',e=>{
 speed=Number(e.target.value);
});
document.getElementById('rotate').addEventListener('click',e=>{
 rotating=!rotating;
 e.target.textContent=rotating?'إيقاف الدوران':'تشغيل الدوران';
});
document.getElementById('reset').addEventListener('click',()=>{
 group.rotation.set(0,0,0);
 group.scale.setScalar(1);
 document.getElementById('scale').value=1;
 speed=.008;
 document.getElementById('speed').value=speed;
 rotating=true;
 document.getElementById('rotate').textContent='إيقاف الدوران';
});

let dragging=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',e=>{
 dragging=true;lastX=e.clientX;lastY=e.clientY;
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(!dragging)return;
 group.rotation.y+=(e.clientX-lastX)*.01;
 group.rotation.x+=(e.clientY-lastY)*.01;
 lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

function resize(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

document.getElementById('save').addEventListener('click',()=>{
 renderer.render(scene,camera);
 const a=document.createElement('a');
 a.download='ABDO-3D-DESIGN.png';
 a.href=renderer.domElement.toDataURL('image/png');
 a.click();
});

function animate(){
 requestAnimationFrame(animate);
 if(rotating&&!dragging){
  group.rotation.y+=speed;
  group.rotation.x+=speed*.35;
 }
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
